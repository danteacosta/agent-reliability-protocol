[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-protocol"
version = "2.0.0"
description = "Neutral, portable reliability contracts for agentic systems"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
arp-contract-test = "agent_reliability_protocol.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_reliability_protocol = ["schemas/*.json", "fixtures/v1/*.json", "fixtures/v2/*.json"]
